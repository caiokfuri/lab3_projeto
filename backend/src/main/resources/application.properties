spring.application.name=moeda-estudantil
server.port=8080

# Front-end React: o build (`npm run build` em ../frontend) gera ../frontend/dist, servido pelo próprio Spring.
# Caminho relativo à pasta de onde o app é iniciado (backend/).
app.frontend.dir=../frontend/dist/

# Fotos das vantagens enviadas pelas empresas parceiras (servidas em /uploads/**)
app.uploads.dir=./uploads/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Banco H2 em arquivo (persistente entre execuções). Console em /h2-console
spring.datasource.url=jdbc:h2:file:./data/moeda-estudantil;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# ORM (JPA/Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Autenticação: validade do token de sessão
app.auth.validade-horas=8

# E-mail. Sem servidor SMTP configurado, os e-mails são apenas registrados no log (modo simulado).
# Para envio real, defina as variáveis de ambiente SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME e SPRING_MAIL_PASSWORD (ex.: Gmail, Mailtrap, MailHog).
app.email.remetente=nao-responda@moedaestudantil.com.br
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
