spring.application.name=moeda-estudantil
# Na Render a porta é definida pela variável PORT.
server.port=${PORT:8080}

# Front-end React: o build (`npm run build` em ../frontend) gera ../frontend/dist, servido pelo próprio Spring
# na execução local. Caminho relativo à pasta de onde o app é iniciado (backend/). Na nuvem o front fica na Vercel.
app.frontend.dir=../frontend/dist/

# Origens que podem chamar a API (lista separada por vírgula; aceita curingas). Em produção: APP_CORS_ORIGENS.
app.cors.origens=http://localhost:*,http://127.0.0.1:*

# Fotos das vantagens (guardadas no banco, tabela foto)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Banco H2 em arquivo para execução local. Na nuvem, a variável DATABASE_URL (PostgreSQL) tem prioridade
# (ver config/DatabaseUrlEnvironmentPostProcessor). Console em /h2-console.
spring.datasource.url=jdbc:h2:file:./data/moeda-estudantil;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# ORM (JPA/Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Autenticação: validade do token de sessão
app.auth.validade-horas=8

# E-mail. Canal escolhido nesta ordem:
#   1. API da Brevo, se APP_EMAIL_BREVO_API_KEY estiver definida (usado na nuvem: a Render bloqueia SMTP);
#   2. SMTP, se SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD estiverem definidas;
#   3. nenhum: os e-mails são apenas registrados no log (modo simulado).
# O remetente precisa ser um endereço verificado no provedor (APP_EMAIL_REMETENTE).
app.email.remetente=nao-responda@moedaestudantil.com.br
app.email.brevo-api-key=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
