spring.application.name=moeda-estudantil
server.port=8080

# Front-end fica em ../frontend (raiz do projeto) e é servido pelo próprio Spring.
# Caminho relativo à pasta de onde o app é iniciado (backend/).
spring.web.resources.static-locations=file:../frontend/

# Banco H2 em arquivo (persistente entre execuções). Console em /h2-console
spring.datasource.url=jdbc:h2:file:./data/moeda-estudantil;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# ORM (JPA/Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
