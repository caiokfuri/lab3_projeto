# Perfil da nuvem (Render): SPRING_PROFILES_ACTIVE=prod.
# O banco vem de DATABASE_URL (PostgreSQL); ver config/DatabaseUrlEnvironmentPostProcessor.

# Front-end hospedado na Vercel (domínio de produção e das prévias). Para restringir ao domínio do projeto,
# defina APP_CORS_ORIGENS, ex.: https://moeda-estudantil.vercel.app
app.cors.origens=https://*.vercel.app,http://localhost:*

spring.h2.console.enabled=false

# O plano gratuito do PostgreSQL da Render aceita poucas conexões e a instância tem 512 MB.
spring.datasource.hikari.maximum-pool-size=5
