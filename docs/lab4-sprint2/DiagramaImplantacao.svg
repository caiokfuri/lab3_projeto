  <text x="1008" y="434" text-anchor="middle">«node»</text>
  <text x="1008" y="451" text-anchor="middle" font-weight="bold">Render — PostgreSQL</text>
  <text x="1008" y="467" text-anchor="middle" font-size="11">plano free · 1 GB</text>

  <rect x="888" y="478" width="240" height="66" fill="#ffffff" stroke="#1d2433"/>
  <use href="#icone-artefato" x="1106" y="484"/>
  <text x="1008" y="496" text-anchor="middle">«database»</text>
  <text x="1008" y="512" text-anchor="middle" font-weight="bold">moeda_estudantil</text>
  <text x="1008" y="530" text-anchor="middle" font-size="11">tabelas do Modelo ER</text>

  <!-- ===================== «node» Brevo ===================== -->
  <g stroke="#1d2433" stroke-width="1.2">
    <polygon points="870,614 884,600 1160,600 1146,614" fill="#d9d9d9"/>
    <polygon points="1146,614 1160,600 1160,716 1146,730" fill="#c4c4c4"/>
    <rect x="870" y="614" width="276" height="116" fill="#f1f1f1"/>
