  </g>
  <text x="205" y="154" text-anchor="middle">«execution environment»</text>
  <text x="205" y="170" text-anchor="middle" font-weight="bold">Navegador web</text>

  <rect x="68" y="182" width="276" height="80" fill="#ffffff" stroke="#1d2433"/>
  <use href="#icone-artefato" x="322" y="188"/>
  <text x="206" y="200" text-anchor="middle">«artifact»</text>
  <text x="206" y="216" text-anchor="middle" font-weight="bold">SPA React</text>
  <text x="206" y="234" text-anchor="middle" font-size="11">index.html · assets/*.js · assets/*.css</text>
  <text x="206" y="250" text-anchor="middle" font-size="11">token de sessão no localStorage</text>

  <!-- ===================== «node» Vercel ===================== -->
  <g stroke="#1d2433" stroke-width="1.2">
    <polygon points="480,74 494,60 840,60 826,74" fill="#d9d9d9"/>
    <polygon points="826,74 840,60 840,246 826,260" fill="#c4c4c4"/>
    <rect x="480" y="74" width="346" height="186" fill="#f1f1f1"/>
  </g>
  <text x="653" y="94" text-anchor="middle">«node»</text>
  <text x="653" y="111" text-anchor="middle" font-weight="bold">Vercel — Edge Network (CDN)</text>
  <text x="653" y="127" text-anchor="middle" font-size="11">plano Hobby (gratuito)</text>

  <rect x="498" y="140" width="310" height="104" fill="#ffffff" stroke="#1d2433"/>
  <use href="#icone-artefato" x="786" y="146"/>
  <text x="653" y="158" text-anchor="middle">«artifact»</text>
  <text x="653" y="174" text-anchor="middle" font-weight="bold">frontend/dist</text>
  <text x="653" y="192" text-anchor="middle" font-size="11">build do Vite (npm run build)</text>
  <text x="653" y="208" text-anchor="middle" font-size="11">vercel.json: rotas do React → index.html</text>
  <text x="653" y="224" text-anchor="middle" font-size="11">VITE_API_URL = endereço da API na Render</text>

