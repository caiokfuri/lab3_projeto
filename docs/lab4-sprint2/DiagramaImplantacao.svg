  <text x="1023" y="111" text-anchor="middle" font-weight="bold">GitHub</text>

  <rect x="916" y="124" width="214" height="90" fill="#ffffff" stroke="#1d2433"/>
  <use href="#icone-artefato" x="1108" y="130"/>
