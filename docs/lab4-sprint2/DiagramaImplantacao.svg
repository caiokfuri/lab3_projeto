  <text x="1008" y="651" text-anchor="middle" font-weight="bold">Brevo — API de e-mail</text>
  <text x="1008" y="667" text-anchor="middle" font-size="11">serviço externo (opcional)</text>
  <text x="1008" y="690" text-anchor="middle" font-size="11">moedas recebidas · cupom · conferência</text>
  <text x="1008" y="706" text-anchor="middle" font-size="11">sem chave: e-mails simulados no log</text>

  <!-- ===================== caminhos de comunicação ===================== -->
  <g stroke="#1d2433" stroke-width="1.4" fill="none">
    <!-- navegador — Vercel -->
    <line x1="376" y1="170" x2="480" y2="170"/>
    <!-- navegador — API -->
    <line x1="230" y1="290" x2="420" y2="414"/>
    <!-- API — PostgreSQL -->
    <line x1="766" y1="480" x2="870" y2="480"/>
    <!-- API — Brevo -->
    <line x1="766" y1="672" x2="870" y2="672"/>
  </g>
  <text x="428" y="160" text-anchor="middle" font-size="11">«HTTPS»</text>
  <text x="428" y="186" text-anchor="middle" font-size="11">baixa a SPA</text>

  <text x="345" y="336" font-size="11">«HTTPS»</text>
  <text x="345" y="352" font-size="11">API REST (JSON + token Bearer)</text>

  <text x="818" y="470" text-anchor="middle" font-size="11">«TCP/JDBC»</text>
  <text x="818" y="496" text-anchor="middle" font-size="11">rede interna</text>

  <text x="818" y="662" text-anchor="middle" font-size="11">«HTTPS»</text>
  <text x="818" y="688" text-anchor="middle" font-size="11">envio</text>

  <!-- ===================== implantação contínua (dependências) ===================== -->
  <g stroke="#1d2433" stroke-width="1.2" stroke-dasharray="6 4" fill="none" marker-end="url(#seta-aberta)">
    <line x1="900" y1="150" x2="828" y2="150"/>
    <line x1="1000" y1="230" x2="702" y2="400"/>
  </g>
  <text x="863" y="140" text-anchor="middle" font-size="11">«deploy»</text>
  <text x="872" y="318" font-size="11">«deploy»</text>
  <text x="872" y="334" font-size="11">build da imagem Docker a cada push</text>
  <text x="863" y="168" text-anchor="middle" font-size="10">push</text>
