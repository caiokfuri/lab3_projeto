  <text x="508" y="451" text-anchor="middle" font-weight="bold">Render — Web Service</text>
  <text x="508" y="467" text-anchor="middle" font-size="11">plano free · 512 MB · região Oregon</text>

  <g stroke="#1d2433" stroke-width="1">
    <polygon points="270,490 280,480 750,480 740,490" fill="#e3eedf"/>
    <polygon points="740,490 750,480 750,702 740,712" fill="#d6e4d0"/>
    <rect x="270" y="490" width="470" height="222" fill="#f6faf4"/>
  </g>
  <text x="505" y="508" text-anchor="middle">«execution environment»</text>
  <text x="505" y="524" text-anchor="middle" font-weight="bold">Contêiner Docker (eclipse-temurin:25-jre)</text>

  <g stroke="#1d2433" stroke-width="1">
    <polygon points="290,546 300,536 720,536 710,546" fill="#e3eedf"/>
    <polygon points="710,546 720,536 720,686 710,696" fill="#d6e4d0"/>
    <rect x="290" y="546" width="420" height="150" fill="#ffffff"/>
  </g>
  <text x="500" y="564" text-anchor="middle">«execution environment»</text>
  <text x="500" y="580" text-anchor="middle" font-weight="bold">JVM Java 25</text>

  <rect x="308" y="592" width="384" height="92" fill="#ffffff" stroke="#1d2433"/>
  <use href="#icone-artefato" x="670" y="598"/>
  <text x="500" y="610" text-anchor="middle">«artifact»</text>
  <text x="500" y="626" text-anchor="middle" font-weight="bold">moeda-estudantil.jar</text>
  <text x="500" y="644" text-anchor="middle" font-size="11">Spring Boot 3.5 · API REST /api/** na porta $PORT</text>
  <text x="500" y="660" text-anchor="middle" font-size="11">MVC: Controller → Service → DAO (JPA/Hibernate)</text>
  <text x="500" y="676" text-anchor="middle" font-size="11">SPRING_PROFILES_ACTIVE=prod · DATABASE_URL</text>

  <!-- ===================== «node» PostgreSQL ===================== -->
  <g stroke="#1d2433" stroke-width="1.2">
    <polygon points="870,414 884,400 1160,400 1146,414" fill="#f3e3c3"/>
    <polygon points="1146,414 1160,400 1160,546 1146,560" fill="#e9d3a8"/>
