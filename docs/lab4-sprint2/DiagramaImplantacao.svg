  <text x="1023" y="176" text-anchor="middle" font-size="11">branch main</text>
  <text x="1023" y="192" text-anchor="middle" font-size="11">render.yaml · backend/Dockerfile</text>
  <text x="1023" y="206" text-anchor="middle" font-size="11">frontend/vercel.json</text>

