<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 770" width="1190" height="770" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1d2433">
  <title>Diagrama de Implantação — Sistema de Moeda Estudantil</title>
  <defs>
    <marker id="seta-aberta" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#1d2433" stroke-width="1.4"/>
    </marker>
    <!-- ícone de artefato (folha com canto dobrado) -->
    <g id="icone-artefato" fill="#fff" stroke="#1d2433" stroke-width="1">
      <path d="M0,0 H9 L14,5 V18 H0 Z"/>
      <path d="M9,0 V5 H14" fill="none"/>
    </g>
  </defs>

  <rect width="1190" height="770" fill="#ffffff"/>
  <text x="595" y="32" text-anchor="middle" font-size="16" font-weight="bold">Diagrama de Implantação — Sistema de Moeda Estudantil (Lab04S02)</text>

  <!-- ===================== «device» usuário ===================== -->
  <g stroke="#1d2433" stroke-width="1.2">
    <polygon points="30,74 44,60 390,60 376,74" fill="#c9d6ea"/>
    <polygon points="376,74 390,60 390,276 376,290" fill="#aebfdc"/>
    <rect x="30" y="74" width="346" height="216" fill="#e8eef8"/>
  </g>
  <text x="203" y="94" text-anchor="middle">«device»</text>
  <text x="203" y="111" text-anchor="middle" font-weight="bold">Computador ou celular do usuário</text>

  <g stroke="#1d2433" stroke-width="1">
    <polygon points="50,136 60,126 370,126 360,136" fill="#dbe4f3"/>
    <polygon points="360,136 370,126 370,266 360,276" fill="#c9d6ea"/>
