<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alunos · Moeda Estudantil</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <div class="conteudo">
        <a class="marca" href="index.html">Moeda Estudantil</a>
        <nav>
            <a href="alunos.html" class="ativo">Alunos</a>
            <a href="empresas.html">Empresa(s) parceira(s)</a>
        </nav>
    </div>
</header>

<main class="conteudo">
    <h1>Alunos</h1>
    <p class="subtitulo">Cadastro de alunos participantes do sistema de mérito.</p>

    <div id="mensagem" class="mensagem" role="status"></div>

    <section class="cartao">
        <h2 id="titulo-form">Novo aluno</h2>
        <form id="form-aluno" novalidate>
            <input type="hidden" name="id">
            <div class="grade">
                <div class="campo largo">
                    <label for="nome">Nome</label>
                    <input id="nome" name="nome" required maxlength="255">
                    <span class="erro-campo"></span>
                </div>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" required>
                    <span class="erro-campo"></span>
                </div>
                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input id="cpf" name="cpf" required placeholder="000.000.000-00" maxlength="14">
                    <span class="erro-campo"></span>
                </div>
                <div class="campo">
                    <label for="rg">RG</label>
                    <input id="rg" name="rg" required maxlength="20">
                    <span class="erro-campo"></span>
                </div>
                <div class="campo largo">
                    <label for="endereco">Endereço</label>
                    <input id="endereco" name="endereco" required maxlength="255">
                    <span class="erro-campo"></span>
                </div>
                <div class="campo">
                    <label for="instituicaoId">Instituição de ensino</label>
                    <select id="instituicaoId" name="instituicaoId" required>
                        <option value="">Selecione...</option>
                    </select>
                    <span class="erro-campo"></span>
                </div>
                <div class="campo">
                    <label for="curso">Curso</label>
                    <input id="curso" name="curso" required maxlength="255">
                    <span class="erro-campo"></span>
                </div>
                <div class="campo">
                    <label for="login">Login</label>
                    <input id="login" name="login" required minlength="3" maxlength="50" autocomplete="username">
                    <span class="erro-campo"></span>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input id="senha" name="senha" type="password" minlength="6" autocomplete="new-password">
                    <span class="erro-campo"></span>
                    <span class="dica" id="dica-senha">Mínimo de 6 caracteres.</span>
                </div>
            </div>
            <div class="acoes">
                <button type="submit" class="btn-primario" id="btn-salvar">Cadastrar</button>
                <button type="button" class="btn-secundario" id="btn-cancelar" hidden>Cancelar edição</button>
            </div>
        </form>
    </section>

    <section class="cartao">
        <h2>Alunos cadastrados</h2>
        <div class="tabela-container">
            <table>
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>E-mail</th>
                    <th>Instituição</th>
                    <th>Curso</th>
                    <th>Saldo</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="tabela-alunos">
                <tr><td colspan="7" class="vazio">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script src="js/api.js"></script>
<script src="js/alunos.js"></script>
</body>
</html>
