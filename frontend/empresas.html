<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Empresas parceiras · Moeda Estudantil</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <div class="conteudo">
        <a class="marca" href="index.html">Moeda Estudantil</a>
        <nav>
            <a href="alunos.html">Alunos</a>
            <a href="empresas.html" class="ativo">Empresas parceiras</a>
        </nav>
    </div>
</header>

<main class="conteudo">
    <h1>Empresas parceiras</h1>
    <p class="subtitulo">Empresas que oferecem vantagens em troca de moedas.</p>

    <div id="mensagem" class="mensagem" role="status"></div>

    <section class="cartao">
        <h2 id="titulo-form">Nova empresa parceira</h2>
        <form id="form-empresa" novalidate>
            <input type="hidden" name="id">
            <div class="grade">
                <div class="campo largo">
                    <label for="nome">Nome</label>
                    <input id="nome" name="nome" required maxlength="255">
                    <span class="erro-campo"></span>
                </div>
                <div class="campo">
                    <label for="cnpj">CNPJ</label>
                    <input id="cnpj" name="cnpj" required placeholder="00.000.000/0000-00" maxlength="18">
                    <span class="erro-campo"></span>
                </div>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" required>
                    <span class="erro-campo"></span>
                </div>
                <div class="campo">
                    <label for="login">Login</label>
                    <input id="login" name="login" required minlength="3" maxlength="50" autocomplete="username">
                    <span class="erro-campo"></span>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input id="senha" name="senha" type="password" minlength="6" autocomplete="new-password">
                    <span class="erro-campo"></span>
                    <span class="dica" id="dica-senha">Mínimo de 6 caracteres.</span>
                </div>
            </div>
            <div class="acoes">
                <button type="submit" class="btn-primario" id="btn-salvar">Cadastrar</button>
                <button type="button" class="btn-secundario" id="btn-cancelar" hidden>Cancelar edição</button>
            </div>
        </form>
    </section>

    <section class="cartao">
        <h2>Empresas cadastradas</h2>
        <div class="tabela-container">
            <table>
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>CNPJ</th>
                    <th>E-mail</th>
                    <th>Login</th>
                    <th>Vantagens</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="tabela-empresas">
                <tr><td colspan="6" class="vazio">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script src="js/api.js"></script>
<script src="js/empresas.js"></script>
</body>
</html>
